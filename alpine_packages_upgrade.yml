---
- name: Upgrade Alpine packages
  hosts: all
  gather_facts: false

  tasks:
    - name: Install Python3 via raw module (no Python required on host)
      ansible.builtin.raw: "apk update && apk add python3"
      register: python_install
      changed_when: "'Installing' in python_install.stdout"

    - name: Upgrade all installed packages
      community.general.apk:
        upgrade: true
        update_cache: true

    - name: Show Alpine version
      ansible.builtin.command: cat /etc/alpine-release
      register: alpine_version
      changed_when: false

    - name: Display current Alpine version
      ansible.builtin.debug:
        msg: "Current Alpine version: {{ alpine_version.stdout }}"
