---
- name: Full Alpine System Upgrade
  hosts: all
  gather_facts: false

  tasks:
    - name: Ensure python3 is installed (via raw to bypass dependency check)
      ansible.builtin.raw: "apk update && apk add python3"
      register: python_install
      changed_when: "'Installing' in python_install.stdout"

    - name: Read current Alpine version before upgrade
      ansible.builtin.command: cat /etc/alpine-release
      register: version_before
      changed_when: false

    - name: Update APK package index
      community.general.apk:
        update_cache: true

    - name: Upgrade all installed packages
      community.general.apk:
        upgrade: true

    - name: Perform full release upgrade (available)
      ansible.builtin.command: apk upgrade --available
      register: upgrade_result
      changed_when: "'Upgrading' in upgrade_result.stdout or 'installing' in upgrade_result.stdout"

    - name: Read Alpine version after upgrade
      ansible.builtin.command: cat /etc/alpine-release
      register: version_after
      changed_when: false

    - name: Show version change
      ansible.builtin.debug:
        msg: "The Alpine version has changed from {{ version_before.stdout }} to {{ version_after.stdout }}"
      when: version_before.stdout != version_after.stdout

    - name: Report no changes
      ansible.builtin.debug:
        msg: "No release upgrade detected. Current version remains: {{ version_before.stdout }}"
      when: version_before.stdout == version_after.stdout

    - name: Reboot if version changed
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: version_before.stdout != version_after.stdout
