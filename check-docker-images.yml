---
- name: Check Docker Compose image updates
  hosts: all
  become: true
  gather_facts: false

  vars:
    compose_root: /opt
    compose_filename: docker-compose.yml
    excluded_paths:
      - /opt/containerd

  tasks:

    # ============================================================
    # Check Docker
    # ============================================================

    - name: Check if Docker is installed
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false
      failed_when: false

    - name: Set Docker availability
      ansible.builtin.set_fact:
        docker_available: "{{ docker_version.rc == 0 }}"

    # ============================================================
    # Check Docker Compose
    # ============================================================

    - name: Check if Docker Compose is available
      ansible.builtin.command:
        cmd: docker compose version
      register: compose_version
      changed_when: false
      failed_when: false
      when: docker_available

    - name: Set Docker Compose availability
      ansible.builtin.set_fact:
        compose_available: "{{ docker_available and compose_version.rc == 0 }}"

    # ============================================================
    # Find all Docker Compose files below /opt
    #
    # Example:
    #
    # /opt/zabbix/docker-compose.yml       -> included
    # /opt/nginx/docker-compose.yml        -> included
    # /opt/containerd/docker-compose.yml   -> excluded
    #
    # ============================================================

    - name: Find Docker Compose files
      ansible.builtin.find:
        paths: "{{ compose_root }}"
        patterns:
          - "{{ compose_filename }}"
        recurse: true
        file_type: file
      register: compose_files
      when:
        - docker_available
        - compose_available

    # ============================================================
    # Exclude /opt/containerd
    # ============================================================

    - name: Filter excluded Compose paths
      ansible.builtin.set_fact:
        compose_files_filtered: >-
          {{
            compose_files.files
            | rejectattr('path', 'match', '^/opt/containerd(/|$)')
            | list
          }}
      when:
        - docker_available
        - compose_available

    # ============================================================
    # Build list of Compose project directories
    # ============================================================

    - name: Build Compose project list
      ansible.builtin.set_fact:
        compose_projects: >-
          {{
            compose_files_filtered
            | map(attribute='path')
            | map('dirname')
            | unique
            | sort
            | list
          }}
      when:
        - docker_available
        - compose_available

    # ============================================================
    # Show discovered Compose projects
    # ============================================================

    - name: Show discovered Compose projects
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Compose projects: {{ compose_projects | default([]) }}"
      when:
        - docker_available
        - compose_available

    # ============================================================
    # Get images from every Compose project
    #
    # docker compose config --images resolves the Compose file
    # and returns the actual images used by the project.
    # ============================================================

    - name: Get images from Docker Compose projects
      ansible.builtin.command:
        cmd: >
          docker compose
          -f {{ item }}/{{ compose_filename }}
          config --images
      args:
        chdir: "{{ item }}"
      loop: "{{ compose_projects | default([]) }}"
      register: compose_image_results
      changed_when: false
      failed_when: false
      when:
        - docker_available
        - compose_available

    # ============================================================
    # Show Compose errors, if any
    # ============================================================

    - name: Report Compose configuration errors
      ansible.builtin.debug:
        msg:
          - "Compose project: {{ item.item }}"
          - "Return code: {{ item.rc }}"
          - "Error: {{ item.stderr }}"
      loop: "{{ compose_image_results.results | default([]) }}"
      when:
        - docker_available
        - compose_available
        - item.rc != 0

    # ============================================================
    # Build unique image list
    # ============================================================

    - name: Build unique Docker image list
      ansible.builtin.set_fact:
        docker_images: >-
          {{
            compose_image_results.results
            | selectattr('rc', 'equalto', 0)
            | map(attribute='stdout_lines')
            | flatten
            | map('trim')
            | reject('equalto', '')
            | unique
            | sort
            | list
          }}
      when:
        - docker_available
        - compose_available

    # ============================================================
    # Show discovered images
    # ============================================================

    - name: Show discovered Docker images
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Images: {{ docker_images | default([]) }}"
      when:
        - docker_available
        - compose_available

    # ============================================================
    # Get local image information
    # ============================================================

    - name: Inspect local Docker images
      ansible.builtin.command:
        cmd: >
          docker image inspect
          --format {% raw %}'{{json .RepoDigests}}'{% endraw %}
          {{ item }}
      loop: "{{ docker_images | default([]) }}"
      register: local_image_results
      changed_when: false
      failed_when: false
      when:
        - docker_available
        - compose_available

    # ============================================================
    # Get remote image manifest
    #
    # No image is pulled.
    # Docker only queries the registry.
    # ============================================================

    - name: Inspect remote Docker manifests
      ansible.builtin.command:
        cmd: >
          docker manifest inspect
          --verbose
          {{ item }}
      loop: "{{ docker_images | default([]) }}"
      register: remote_manifest_results
      changed_when: false
      failed_when: false
      when:
        - docker_available
        - compose_available

    # ============================================================
    # Initialize result list
    # ============================================================

    - name: Initialize image results
      ansible.builtin.set_fact:
        image_results: []
      when:
        - docker_available
        - compose_available

    # ============================================================
    # Process every image
    # ============================================================

    - name: Compare local and remote image information
      ansible.builtin.set_fact:
        image_results: >-
          {{
            image_results +
            [{
              'image': item.item,
              'local_digest': local_digest,
              'remote_digest': remote_digest,
              'status': image_status
            }]
          }}
      vars:

        # --------------------------------------------------------
        # Local image result
        # --------------------------------------------------------

        local_result: >-
          {{
            local_image_results.results
            | selectattr('item', 'equalto', item.item)
            | first
            | default({})
          }}

        local_repodigests: >-
          {{
            local_result.stdout
            | default('[]')
            | from_json
          }}

        local_digest: >-
          {{
            local_repodigests[0]
            | default('unknown')
          }}

        # --------------------------------------------------------
        # Remote manifest result
        # --------------------------------------------------------

        remote_result: >-
          {{
            remote_manifest_results.results
            | selectattr('item', 'equalto', item.item)
            | first
            | default({})
          }}

        remote_json: >-
          {{
            remote_result.stdout
            | default('{}')
            | from_json
          }}

        # --------------------------------------------------------
        # Remote digest
        #
        # Docker manifest inspect --verbose normally returns:
        #
        # {
        #   "Descriptor": {
        #       "digest": "sha256:..."
        #   }
        # }
        #
        # --------------------------------------------------------

        remote_digest: >-
          {{
            remote_json.Descriptor.digest
            | default(
                remote_json.Descriptor.Digest
                | default(
                    remote_json.Digest
                    | default('unknown')
                )
              )
          }}

        # --------------------------------------------------------
        # Determine status
        # --------------------------------------------------------

        image_status: >-
          {{
            'NOT INSTALLED'
            if local_result.rc | default(1) != 0
            else
            'REGISTRY CHECK FAILED'
            if remote_result.rc | default(1) != 0
            else
            'UP TO DATE'
            if (
              local_digest != 'unknown'
              and remote_digest != 'unknown'
              and remote_digest in local_digest
            )
            else
            'UPDATE AVAILABLE'
          }}

      loop: "{{ remote_manifest_results.results | default([]) }}"
      when:
        - docker_available
        - compose_available

    # ============================================================
    # Get only images with available updates
    # ============================================================

    - name: Get available updates
      ansible.builtin.set_fact:
        available_updates: >-
          {{
            image_results
            | selectattr('status', 'equalto', 'UPDATE AVAILABLE')
            | list
          }}
      when:
        - docker_available
        - compose_available

    # ============================================================
    # Display final report
    # ============================================================

    - name: Display Docker image update report
      ansible.builtin.debug:
        msg: |
          ============================================================
          Docker Image Update Report
          ============================================================

          Host:
            {{ inventory_hostname }}

          Docker:
            {{ docker_version.stdout | default('Not installed') }}

          Docker Compose:
            {{ compose_version.stdout | default('Not available') }}

          Compose projects:
          {% if compose_projects | default([]) | length > 0 %}
          {% for project in compose_projects %}
            - {{ project }}
          {% endfor %}
          {% else %}
            None
          {% endif %}

          Images:
          {% if image_results | default([]) | length > 0 %}
          {% for image in image_results %}
            {{ "%-55s" | format(image.image) }} {{ image.status }}
          {% endfor %}
          {% else %}
            No images found.
          {% endif %}

          Updates available:
            {{ available_updates | default([]) | length }}

          ============================================================
      when: docker_available

    # ============================================================
    # Report hosts without Docker
    # ============================================================

    - name: Report Docker not installed
      ansible.builtin.debug:
        msg: |
          ============================================================
          Docker Image Update Report
          ============================================================

          Host:
            {{ inventory_hostname }}

          Docker:
            NOT INSTALLED

          ============================================================
      when: not docker_available

    # ============================================================
    # Report hosts without Docker Compose
    # ============================================================

    - name: Report Docker Compose not available
      ansible.builtin.debug:
        msg: |
          ============================================================
          Docker Image Update Report
          ============================================================

          Host:
            {{ inventory_hostname }}

          Docker:
            {{ docker_version.stdout }}

          Docker Compose:
            NOT AVAILABLE

          ============================================================
      when:
        - docker_available
        - not compose_available
